{% extends "base.html" %}
{% block title %}New research list · {{ DASHBOARD_NAME }}{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="sub"><a href="/research">Research</a> / List</p><h1>New list</h1></div></div>
<section class="form-panel compact-form">
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post" action="/research/lists">
        <label>Title<input name="title" required maxlength="160" value="{{ record.title if record else '' }}"></label>
        <label>Description<textarea name="description" rows="5">{{ record.description if record else '' }}</textarea></label>
        <div class="form-actions"><button type="submit">Create list</button><a class="ghost" href="/research">Cancel</a></div>
    </form>
</section>
{% endblock %}
